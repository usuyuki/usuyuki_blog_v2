services:
  ghost:
    image: ghost:6-alpine
    environment:
      # see https://ghost.org/docs/config/#configuration-options
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: example
      database__connection__database: ghost
      NODE_ENV: development
      url: ${BACKEND_API_URL}
    volumes:
      - ./backend/images:/var/lib/ghost/content/images
      - ./backend/data:/var/lib/ghost/content/data
      - ./backend/config.development.json:/var/lib/ghost/config.development.json
    user: "1000:1000"
    ports:
      - "1001:2368"
    depends_on:
      - db
    healthcheck:
      # 認証なしで200を返すAdmin APIのsiteエンドポイントで、Ghostが起動済みかを確認する。
      # 以前は無効なキーでContent APIを叩いていたが、Ghostの総当たり対策(express-brute)が
      # 失敗を数えて429を返し、10秒ごとにERRORログが出ていたため変更した。
      # wgetは2xx以外で失敗するので、Ghostが応答できない間は不合格になる。
      # urlがhttpsの本番では、平文httpで来たAdmin APIのリクエストをGhostが公開URLへ301で飛ばし、
      # wgetがそれを追ってCloudflare経由の公開サイトを確認してしまう(このコンテナの状態を見られない)。
      # X-Forwarded-Proto: httpsを付けてHTTPS経由とみなさせ、リダイレクトさせない(urlがhttpの開発環境でも200)。
      # localhostはIPv6解決で接続拒否になるため127.0.0.1を明示する
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "--header=X-Forwarded-Proto: https",
          "http://127.0.0.1:2368/ghost/api/admin/site/",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  astro:
    build:
      context: ./frontend
      dockerfile: ../infra/dev/astro/Dockerfile
    volumes:
      - ./frontend:/frontend
      # macのDocker Desktopはバインドマウント(VirtioFS)のI/Oが遅く、
      # node_modulesをホスト共有すると開発サーバーが極端に遅くなるためnamed volumeに分離
      - astro-node-modules:/frontend/node_modules
    ports:
      - "1000:1000"
    stdin_open: true
    tty: true
    environment:
      NODE_ENV: development
      GHOST_CONTENT_KEY: ${GHOST_CONTENT_KEY}
      GHOST_API_URL: ${GHOST_API_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      EXTERNAL_BLOGS: ${EXTERNAL_BLOGS}
      GHOST_FRONT_URL: ${GHOST_FRONT_URL}
      REACTIONS_DB_HOST: db
      REACTIONS_DB_USER: root
      REACTIONS_DB_PASSWORD: example
      REACTIONS_DB_NAME: usuyuki_blog
      REACTIONS_NSFW_BLOCKLIST: ${REACTIONS_NSFW_BLOCKLIST:-🖕,💢}
      # 記事詳細ページの ?debug=<値> で全キャッシュを手動クリアするためのトークン(未設定なら無効)
      CACHE_CLEAR_TOKEN: ${CACHE_CLEAR_TOKEN:-}
      # ファイル変更検知のポーリングはCHOKIDAR_USEPOLLING環境変数ではなく
      # astro.config.mjsのvite.server.watchで設定する。
      # 環境変数だとプロセス内の全chokidar(unstorage等)がnode_modulesまで
      # ポーリングしてlibuvスレッドプールが飽和し、devサーバーが起動しなくなる
    user: "1000:1000"
    depends_on:
      # Ghostより先にastroが起動すると記事取得に失敗するため、healthyになるまで待つ
      ghost:
        condition: service_healthy
      db:
        condition: service_started
    # デフォルトのlocalhostだとDockerがバインドしてくれなくてERR_EMPTY_RESPONSEになるので明示的に0.0.0.0を指定

  db:
    image: mysql:8.4
    volumes:
      - db-store:/var/lib/mysql
      - ./infra/db/reactions-init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: example

volumes:
  db-store:
  astro-node-modules:
